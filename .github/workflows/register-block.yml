name: Register Quaisr block

on:
  release:
    types: [published]

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Register block
        uses: quaisr/actions/register-block@v1
        with:
          registry-url: ${{ vars.QUAISR_REGISTRY_URL }}
          directory: "."
        env:
          QUAISR_API_TOKEN: ${{ secrets.QUAISR_API_TOKEN }}
