[project]
name = "nearest-neighbour-gaussian-process"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "botorch",
    "kneed>=0.8.5",
    "pyarrow>=15",
    "upscaling-tools[gp-gpu]",
]

[tool.uv.sources]
upscaling-tools = { path = "./nearest_neighbour_gaussian_process/upscaling_tools/upscaling_tools-0.3.14-py3-none-any.whl" }
botorch = { path = "./nearest_neighbour_gaussian_process/upscaling_tools/botorch-0.1.dev2469+g847979a86-py3-none-any.whl" }

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.basedpyright]
typeCheckingMode = 'standard'
